# Product prebuilt list = famous SNS only.
# Custom site/board: copy _template.yaml → platforms/my_site.yaml (prebuilt: false)
# or register URL shapes in docs/sites-custom.example.json / extension kampff.sites.

prebuilt:
  - id: x
    label: X (Twitter)
    transport: rest
    auth: bearer
    tags: [sns, public]
    note: "connect setup → kampff-collect connect setup --platform x"
  - id: facebook
    label: Facebook (Graph / export)
    transport: rest
    auth: bearer
    tags: [sns, public]
    note: "Page token or data download — connect setup --platform facebook"
  - id: instagram
    label: Instagram (Graph / export)
    transport: rest
    auth: bearer
    tags: [sns, public]
    note: "Business Graph or export — connect setup --platform instagram"
  - id: reddit
    label: Reddit
    transport: rest
    auth: oauth
    tags: [sns, community]
    note: "connect setup → kampff-collect connect setup --platform reddit"
  - id: linkedin
    label: LinkedIn
    transport: file
    auth: none
    tags: [sns, export]
    note: Official member export zip — connect setup --platform linkedin

roll_your_own:
  copy: _template.yaml
  sites_schema: ../../docs/sites.schema.json
  sites_custom_example: ../../docs/sites-custom.example.json
  doc: ../../docs/collectors-generic.md
  note: >
    Any non-SNS board or intranet is custom URL only.
    Do not add regional community presets (KR boards etc.) to this catalog.
